cubes:
  - name: titles
    sql_table: refined.ml.fct_titles

    description: >
      Fato de títulos no grão de um título (`title_key`). Cada linha é um título
      distinto, então toda medida tem o denominador certo seja qual for a dimensão
      usada para fatiar — inclusive as dimensões multi-valor (gênero, país), que
      entram por tabelas de ponte.

    # Ponte título ↔ gênero: um título aparece uma vez por gênero que possui.
    # A `relationship` (uma linha do fato para muitas da ponte) é o que permite ao
    # Cube deduplicar pelo `primary_key` do fato e não inflar `avg_rating`/`total_votes`.
    joins:
      - name: title_genre
        relationship: one_to_many
        sql: "{CUBE}.title_key = {title_genre}.title_key"

      # Ponte título ↔ país: mesma ideia, só que país é parcial na origem.
      - name: title_country
        relationship: one_to_many
        sql: "{CUBE}.title_key = {title_country}.title_key"

    dimensions:
      - name: title_key
        description: Chave do título — é o grão do fato.
        sql: title_key
        type: string
        primary_key: true

      - name: title
        sql: title
        type: string

      - name: release_year
        description: Ano de lançamento.
        sql: year_key
        type: number

      - name: title_type
        description: Tipo do título (Movie / TV Show).
        sql: type_key
        type: string

      - name: added_year
        description: Ano em que o título entrou no catálogo da Netflix.
        sql: added_year
        type: number

      - name: catalog_age_band
        description: >
          Idade do título ao entrar na Netflix, em faixas
          (lançamento 0-1 ano, recente 2-5, catálogo 6-15, clássico 16+).
        sql: catalog_age_band
        type: string

    measures:
      - name: count_titles
        description: Quantidade de títulos distintos.
        type: count_distinct
        sql: title_key

      - name: avg_rating
        description: Nota média da crítica.
        type: avg
        sql: rating

      - name: total_votes
        description: Total de votos da crítica.
        type: sum
        sql: votes

      # --- idade do catálogo (pergunta: a Netflix passou a licenciar títulos antigos?)
      - name: avg_years_to_netflix
        description: Média de anos entre o lançamento e a entrada na Netflix.
        type: avg
        sql: years_to_netflix

      - name: count_catalog_titles
        description: Títulos que entraram na Netflix com mais de 5 anos de lançamento.
        type: count_distinct
        sql: title_key
        filters:
          - sql: "{CUBE}.years_to_netflix > 5"

      # Medida derivada: definida a partir de duas medidas governadas, então a regra
      # ("título de catálogo" = mais de 5 anos) existe em um lugar só.
      - name: share_catalog_titles
        description: >
          Fração (0 a 1) dos títulos que entraram com mais de 5 anos de lançamento.
        type: number
        sql: "CAST({count_catalog_titles} AS DOUBLE) / NULLIF({count_titles}, 0)"
